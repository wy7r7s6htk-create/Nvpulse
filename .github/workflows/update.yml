name: Update NVPulse

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the page
        run: python build.py
      - name: Save changes
        run: |
          git config user.name "nvpulse-bot"
          git config user.email "nvpulse-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Update news" && git push)
